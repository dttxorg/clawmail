services:
  clawmail:
    build: .
    ports:
      - "8080:8080"
    environment:
      CLAWMAIL_ADMIN_USERNAME: admin
      CLAWMAIL_ADMIN_PASSWORD: admin
      CLAWMAIL_MASTER_KEY: change-me-32-byte-master-key
      CLAWMAIL_REFRESH_COOLDOWN_MS: "60000"
    volumes:
      - clawmail-data:/data
    restart: unless-stopped

volumes:
  clawmail-data:
